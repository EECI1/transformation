<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1e5a73">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<title>Cahier de Transformation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : appli mobile d'abord (famille Cahier de Boutique) — en-tête, une vue à la fois, barre d'onglets en bas ; colonne centrée sur ordinateur */
:root{
  --bg:#f1f4f4; --surface:#ffffff; --sunk:#e4eaeb; --line:#cfd8da;
  --ink:#152126; --muted:#53646a;
  --accent:#1e5a73; --accent-ink:#ffffff; --accent-soft:#d6e7ed;
  --gold:#b87d00; --gold-soft:#f6ebcf;
  --good:#2c6e3f; --good-soft:#dcebdf; --bad:#b3261e; --bad-soft:#f7dedb; --warn:#a15c00; --warn-soft:#f8e7cc;
  --s1:#1e5a73; --s2:#5b97ad; --s3:#a9cbd7; --s4:#c99a2e; --s5:#8a5a9e; --s6:#9aa5a8;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-num:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1517; --surface:#172024; --sunk:#202b30; --line:#32424a;
  --ink:#e5eef0; --muted:#98abb2;
  --accent:#6cc0dc; --accent-ink:#06161c; --accent-soft:#17333d;
  --gold:#e3b23c; --gold-soft:#3a2f14;
  --good:#7cc58f; --good-soft:#1e3324; --bad:#ff8a80; --bad-soft:#3d1f1c; --warn:#f0b35a; --warn-soft:#3a2a12;
  --s1:#6cc0dc; --s2:#3f8aa5; --s3:#2a5868; --s4:#d9a640; --s5:#b48ccb; --s6:#5f6b6f;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1517; --surface:#172024; --sunk:#202b30; --line:#32424a;
  --ink:#e5eef0; --muted:#98abb2;
  --accent:#6cc0dc; --accent-ink:#06161c; --accent-soft:#17333d;
  --gold:#e3b23c; --gold-soft:#3a2f14;
  --good:#7cc58f; --good-soft:#1e3324; --bad:#ff8a80; --bad-soft:#3d1f1c; --warn:#f0b35a; --warn-soft:#3a2a12;
  --s1:#6cc0dc; --s2:#3f8aa5; --s3:#2a5868; --s4:#d9a640; --s5:#b48ccb; --s6:#5f6b6f;
  color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.45;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom, 0px))}
.wrap{max-width:720px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.15}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* En-tête */
.top{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;background:var(--bg);
  display:flex;align-items:center;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--line)}
.logo{width:38px;height:38px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.top-t{min-width:0;flex:1}
.top-t h1{font-size:1.2rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.status{font-size:.8rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status[data-s="saved"] i{background:var(--good)}
.status[data-s="saving"] i{background:var(--gold)}
.status[data-s="error"] i{background:var(--bad)}

/* Navigation */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px));
  padding-bottom:env(safe-area-inset-bottom, 0px)}
.tabs-in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:repeat(7,1fr)}
.tab{background:none;border:0;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;
  font-size:.62rem;color:var(--muted);font-weight:700;border-top:3px solid transparent;white-space:nowrap;padding-inline:2px}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--accent);border-top-color:var(--accent)}

.view{display:flex;flex-direction:column;gap:16px;padding-block:16px}
.eyebrow{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700}

/* Barres de navigation date / mois */
.nav{display:flex;align-items:center;gap:8px}
.nav h2{flex:1;font-size:1.35rem;font-weight:700;text-align:center;text-transform:capitalize}
.ib{width:44px;height:44px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.ib:disabled{opacity:.35;cursor:default}
.ib svg{width:20px;height:20px}
.datepick{display:flex;justify-content:center}
.datepick input{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 10px;font-size:.9rem;color:var(--muted)}

/* Bandeau de chiffres */
.strip{display:grid;grid-template-columns:repeat(3,1fr);background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.strip>div{padding:12px 12px;min-width:0}
.strip>div+div{border-left:1px solid var(--line)}
.strip .k{font-size:.78rem;color:var(--muted)}
.strip .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-weight:600;font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Lignes produit (saisie du jour) */
.plist{display:flex;flex-direction:column;gap:10px}
.pl{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.pl.err{border-color:var(--bad)}
.pl.has{border-left:4px solid var(--accent)}
.pl-h{display:flex;align-items:baseline;gap:10px;justify-content:space-between}
.pl-n{font-weight:700;font-size:1.05rem;min-width:0}
.pl-d{font-size:.85rem;color:var(--muted);white-space:nowrap}
.pl-d b{font-family:var(--f-num);color:var(--ink)}
.pl-d.low b{color:var(--warn)}
.pl-f{display:grid;grid-template-columns:1fr 1.3fr;gap:10px}
.fld{display:flex;flex-direction:column;gap:4px;font-size:.8rem;color:var(--muted);font-weight:700;min-width:0}
.in{width:100%;min-width:0;height:46px;border:1px solid var(--line);border-radius:8px;background:var(--bg);padding:0 12px;
  font-family:var(--f-num);font-size:1.1rem;color:var(--ink);font-variant-numeric:tabular-nums}
.in.txt{font-family:var(--f-body);font-size:1rem}
.in:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.step{display:flex;gap:6px}
.step .in{text-align:center;flex:1;min-width:0}
.pl>.pl-f{grid-template-columns:1.35fr 1fr}
@media (max-width:380px){.pl .sb{width:40px}}
.sb{width:46px;height:46px;flex:none;border-radius:8px;border:1px solid var(--line);background:var(--sunk);font-size:1.4rem;font-weight:700;line-height:1}
.pl-c{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.85rem;color:var(--muted)}
.pl-c b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.msg{margin:0;font-size:.88rem;padding:8px 10px;border-radius:8px}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.warn{background:var(--warn-soft);color:var(--warn)}

/* Boutons */
.btn{height:46px;padding:0 18px;border-radius:8px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.quiet{background:var(--surface);border-color:var(--line);color:var(--ink)}
.btn.danger{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.lnk{background:none;border:0;padding:0;color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px}

/* Panneau (cartes simples) */
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.panel h3{font-size:1.05rem;font-weight:700;margin-bottom:10px}

/* Charges */
.chg{display:flex;flex-direction:column}
.chg-r{display:grid;grid-template-columns:1fr 150px 32px;gap:10px;align-items:center;padding-block:8px;border-bottom:1px solid var(--line)}
.chg-r:last-child{border-bottom:0}
.chg-r label,.chg-r .lab{font-weight:700;min-width:0}
.chg-r .lab .hint{display:block;font-weight:400}
.chg-r .auto{text-align:right;font-weight:600;padding-right:12px}
.chg-r.sub{padding-block:4px;font-size:.88rem;color:var(--muted);padding-left:14px;border-bottom:0}
.chg-r .in{text-align:right;height:42px}
.x{width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.2rem}
.x:hover{background:var(--sunk)}
.total{display:flex;justify-content:space-between;align-items:baseline;padding-top:12px;margin-top:4px;border-top:2px solid var(--ink);font-weight:700}
.total .num{font-size:1.2rem}

/* Bilan */
.result{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:12px}
.result.pos{border-top:5px solid var(--good)}
.result.neg{border-top:5px solid var(--bad)}
.res-top{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:99px;font-size:.82rem;font-weight:700}
.chip.pos{background:var(--good-soft);color:var(--good)}
.chip.neg{background:var(--bad-soft);color:var(--bad)}
.chip.mid{background:var(--sunk);color:var(--muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2rem,9vw,2.8rem);font-variant-numeric:tabular-nums;line-height:1}
.big small{font-size:.45em;font-weight:700;color:var(--muted);margin-left:4px}
.result.pos .big{color:var(--good)} .result.neg .big{color:var(--bad)}
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:end;font-size:.8rem;color:var(--muted)}
.eq b{display:block;font-family:var(--f-num);font-size:.98rem;color:var(--ink);font-weight:600;white-space:nowrap}
.eq .op{font-family:var(--f-num);font-size:1.1rem;color:var(--muted);padding-bottom:2px}
.eq>div{min-width:0}
.facts{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.88rem;color:var(--muted)}
.facts b{color:var(--ink);font-family:var(--f-num);font-weight:600}

.tbl-w{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.86rem;min-width:820px}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th{font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);background:var(--sunk);font-weight:700}
td{font-family:var(--f-num);font-variant-numeric:tabular-nums}
th:nth-child(-n+2),td:nth-child(-n+2){text-align:left}
td:nth-child(2){font-family:var(--f-body);font-weight:700}
tfoot td{font-weight:700;border-bottom:0;border-top:2px solid var(--ink)}
td.neg{color:var(--bad)} td.low{color:var(--warn)}
.chart svg{width:100%;height:auto;display:block}
.chart .bar{fill:var(--accent)}
.chart .bar.today{fill:var(--gold)}
.chart .bar.neg{fill:var(--bad)}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:12px}
.legend{font-size:.8rem;color:var(--muted);margin-top:6px}

.alerts{display:flex;flex-direction:column;gap:6px}
.alerts li{list-style:none}
.alerts ul{margin:0;padding:0;display:flex;flex-direction:column;gap:6px}

/* Produits */
.prod{display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding-block:12px;border-bottom:1px solid var(--line);align-items:center}
.prod:last-child{border-bottom:0}
.prod .n{font-weight:700}
.prod .m{font-size:.85rem;color:var(--muted);grid-column:1}
.prod .m b{font-family:var(--f-num);color:var(--ink);font-weight:600}
.prod .s{grid-row:1/3;grid-column:2;text-align:right}
.prod .s b{display:block;font-family:var(--f-num);font-size:1.2rem}
.prod .s span{font-size:.75rem;color:var(--muted)}
.prod .s.low b{color:var(--warn)} .prod .s.zero b{color:var(--bad)}
.prod .acts{grid-column:1/-1;display:flex;gap:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form .full{grid-column:1/-1}
.hint{font-size:.82rem;color:var(--muted);font-weight:400}

.empty{text-align:center;padding:28px 18px;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r);display:flex;flex-direction:column;gap:12px;align-items:center}
.empty p{margin:0;color:var(--muted);max-width:42ch}
.demo{background:var(--gold-soft);color:var(--ink);border-radius:var(--r);padding:10px 14px;font-size:.9rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.confirm{background:var(--bad-soft);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom, 0px));z-index:20;
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:.92rem;max-width:calc(100% - 32px);box-shadow:0 6px 24px rgba(0,0,0,.2)}

.fiche{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 16px;display:flex;flex-direction:column;gap:18px}
.fiche-h{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:2px solid var(--ink)}
.fiche-h h2{font-size:1.5rem;font-weight:800}
.fiche-t{font-size:1rem;font-weight:700;margin-bottom:8px}
.fiche .result{padding:14px 0 0;border:0;border-top:5px solid var(--line);border-radius:0;background:none}
.fiche .result.pos{border-top-color:var(--good)} .fiche .result.neg{border-top-color:var(--bad)}
.fiche-2{display:grid;grid-template-columns:1fr;gap:18px}
@media (min-width:700px){.fiche-2{grid-template-columns:1.2fr 1fr}}
table.t-syn{min-width:560px}
table.t-syn.t-small{min-width:420px}
table.t-syn td:nth-child(2){font-family:var(--f-num);font-weight:400}
table.t-syn td:first-child{font-family:var(--f-body);font-weight:700}
table.t-syn th:nth-child(2),table.t-syn td:nth-child(2){text-align:right}
.fiche-2>div,.fiche>div{min-width:0}
.print-only{display:none!important}
.cs-ov{position:fixed;inset:0;z-index:30;background:rgba(10,16,12,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px}
@media (min-width:620px){.cs-ov{align-items:center}}
.cs{background:var(--surface);color:var(--ink);border-radius:16px;max-width:480px;width:100%;max-height:calc(100vh - 32px);overflow:auto;padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.cs-top{display:flex;justify-content:space-between;align-items:center}
.cs-i{font-size:3.2rem;line-height:1;text-align:center}
.cs h2{font-size:1.35rem;text-align:center}
.cs>p{margin:0;text-align:center}
.cs-ecoute{min-height:56px;font-size:1.1rem}
.cs-al{display:flex;flex-direction:column;gap:6px;border-top:1px solid var(--line);padding-top:10px}
.cs-al .msg{margin:0}
.msg.warn{background:var(--warn-soft);color:var(--warn)}
.cs-nav{justify-content:space-between;font-size:.88rem}
.cs-btn{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--gold-soft);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px}
.cs-btn span:nth-child(2){flex:1}
.cs-n{color:var(--bad);font-weight:700}
.ratio .chip.mid{background:var(--warn-soft);color:var(--warn)}
@media print{#conseil{display:none!important}}
.rgrid{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:620px){.rgrid{grid-template-columns:1fr 1fr}}
.ratio{border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;background:var(--bg)}
.ratio.pos{border-left-color:var(--good)} .ratio.mid{border-left-color:var(--warn)} .ratio.neg{border-left-color:var(--bad)}
.ratio-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.ratio-n{font-weight:700;font-size:.92rem}
.ratio-v{font-size:1.45rem;font-weight:600;line-height:1.1}
.ratio-p{margin:0;font-size:.9rem}
.ratio-c{margin:0;font-size:.78rem;color:var(--muted)}
.top5{margin:2px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.top5 li span:first-child{font-weight:700}
.top5 li{font-size:.9rem}.top5 li .num{margin-left:8px}.top5 li .hint{margin-left:6px}
@media print{
  :root{--bg:#fff;--surface:#fff;--sunk:#eef1ea;--line:#c9d0c2;--ink:#000;--muted:#444;--accent:#1e5a73;--good:#2c6e3f;--bad:#b3261e;--bad-soft:#f7dedb;--accent-soft:#d6e7ed;color-scheme:light}
  @page{size:A4;margin:10mm}
  tr.vide{display:none}
  html,body{background:#fff!important}
  body{padding:0!important;font-size:10pt}
  .top,.tabs,.licbar,.toast,.no-print,.view>*:not(.fiche){display:none!important}
  .view{padding:0;gap:0}
  .view>.print-only{display:flex!important}
  .print-only table.t-cr{min-width:0!important;width:100%}
  .fiche{border:0;padding:0;gap:12px}
  .tbl-w{overflow:visible;border:1px solid var(--line)}
  table,table.t-syn,table.t-syn.t-small{min-width:0;font-size:9pt}
  th,td{padding:2px 6px}
  .chart svg{max-height:3.2cm;width:auto;max-width:100%}
  .chart .legend{display:none}
  .chg-r{padding-block:2px;font-size:9pt}
  .chg-r.sub{padding-block:0;font-size:8.5pt}
  .total{padding-top:4px}
  .fiche .facts{font-size:9pt;gap:2px 14px}
  .fiche-t{margin-bottom:4px;font-size:10.5pt}
  .fiche .result{gap:6px;padding-top:8px}
  .fiche-2{grid-template-columns:1.5fr 1fr;gap:14px}
  table.t-small{font-size:8pt}
  table.t-small th,table.t-small td{padding:2px 4px}
  table.t-small td:first-child,table.t-small th{white-space:normal}
  .big{font-size:20pt}
  .fiche section,.fiche table,.chart{break-inside:avoid}
}

.seg2,.seg3{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.seg2 button,.seg3 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 8px;font-weight:700;font-size:.9rem;line-height:1.2}
.seg2 button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.seg3 button{font-size:.85rem;padding:8px} .seg3 button[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.dot-r{display:inline-grid;place-items:center;min-width:20px;height:20px;border-radius:10px;background:var(--bad);color:#fff;font-size:.75rem;padding:0 5px;margin-left:4px}

/* ---------- Charges, dépenses personnelles, bilan ---------- */
const depJour = d => ((getM(d.slice(0,7)).depj||{})[d]) || [];
function depJourMois(m){ const out = {}; Object.values(getM(m).depj||{}).forEach(arr => arr.forEach(x => { const o = out[x.cid] || (out[x.cid] = {m:0, n:0, nom:x.cnom}); o.m += x.m; o.n++; })); return out; }
function chargesCredit(m){ const out = {}; CR().dettes.forEach(x => { if (x.kind==='charge' && x.date.slice(0,7)===m) { const o = out[x.cid] || (out[x.cid] = {m:0, nom:x.cnom}); o.m += x.m; } }); return out; }
function chargesDuMois(m){
  const list = S.at.charges.map(c => c.salaire ? {id:c.id, nom:c.nom, m:salaireDuMois(m), auto:true} : {id:c.id, nom:c.nom, m:0});
  const dj = depJourMois(m);
  Object.keys(dj).forEach(id => { let x = list.find(c => c.id===id); if (!x) { x = {id, nom:dj[id].nom, m:0, ancien:true}; list.push(x); } x.jour = dj[id].m; x.nj = dj[id].n; x.m += dj[id].m; });
  const cc = chargesCredit(m);
  Object.keys(cc).forEach(id => { let x = list.find(c => c.id===id); if (!x) { x = {id, nom:cc[id].nom, m:0, ancien:true}; list.push(x); } x.credit = cc[id].m; x.m += cc[id].m; });
  const am = amortMois(m); if (am || (S.at.materiel||[]).length) list.push({id:'amort', nom:'Amortissement du matériel', m:am, amort:true});
  return list;
}
/* ---------- Matériel et amortissement ----------
   Chaque bien : {id, nom, date (achat), prix, duree (années), caisse (payé avec l'argent de l'atelier)}.
   L'amortissement mensuel = prix ÷ (durée × 12), compté chaque mois à partir du mois d'achat. */
const moisEcart = (a, b) => (+b.slice(0,4) - +a.slice(0,4))*12 + (+b.slice(5,7) - +a.slice(5,7));
function amortBien(x, m){ const n = Math.round((x.duree||0)*12); if (!n || !x.prix || !x.date) return 0; const k = moisEcart(x.date.slice(0,7), m); return k >= 0 && k < n ? x.prix/n : 0; }
const amortMois = m => (S.at.materiel||[]).reduce((t,x)=>t+amortBien(x,m),0);
const matPaye = (d0, d1) => (S.at.materiel||[]).filter(x => x.caisse && x.date >= d0 && x.date <= d1).reduce((t,x)=>t+(x.prix||0),0);
function valeurMateriel(x, m){ const n = Math.round((x.duree||0)*12); if (!n) return x.prix||0; const k = Math.max(0, Math.min(n, moisEcart(x.date.slice(0,7), m)+1)); return Math.max(0, (x.prix||0) - k*x.prix/n); }
function persoDuMois(m){
  const mp = getM(m).perso || {};
  const list = S.at.perso.map(d => ({id:d.id, nom:d.nom, m:(mp[d.id]&&mp[d.id].m)||0}));
  Object.keys(mp).forEach(id => { if (!S.at.perso.some(d=>d.id===id)) list.push({id, nom:mp[id].n, m:mp[id].m||0, ancien:true}); });
  return list;
}
const salaireDuMois = m => Object.values(getM(m).perso||{}).reduce((a,d)=>a+(d.m||0),0);
function bilan(m){
  const a = full().agg[m] || emptyAgg();
  const rows = S.at.produits.map(p => { const x = a.prod[p.id] || {n:0, obt:0, cost:0, fr:0, mat:{}, q:0, ca:0, cv:0, per:0, cp:0, rendP:0};
    return Object.assign({p, mb: x.ca - x.cv - x.cp}, x); }).filter(r => r.p.actif!==false || r.q || r.obt || r.per);
  const ca = a.ca, achat = a.cv + a.cp, mb = ca - achat;
  const charges = chargesDuMois(m), tc = charges.reduce((s,c)=>s+c.m,0);
  const parJour = {}, mbJour = {}; Object.entries(a.jours).forEach(([d,j]) => { if (j.ca) parJour[d] = j.ca; mbJour[d] = j.mb; });
  /* Coût des ventes réparti par catégorie d'intrant : d'après les lots fabriqués ce mois, sinon d'après la recette */
  const cvCat = {};
  rows.forEach(r => { const sortie = r.cv + r.cp; if (!sortie) return;
    let parts = {}; Object.entries(r.mat||{}).forEach(([id,v]) => { const c = catMp(mpById(id)); parts[c] = (parts[c]||0) + v; }); Object.entries(r.frc||{}).forEach(([c,v]) => parts[c] = (parts[c]||0) + v);
    let tot = Object.values(parts).reduce((t,v)=>t+v,0); if (!tot) { parts = coutFournee(r.p).cats; tot = Object.values(parts).reduce((t,v)=>t+v,0); }
    if (!tot) { cvCat.autre = (cvCat.autre||0) + sortie; return; }
    Object.entries(parts).forEach(([c,v]) => cvCat[c] = (cvCat[c]||0) + sortie*v/tot); });
  const amort = charges.filter(c=>c.amort).reduce((t,c)=>t+c.m,0), sal = charges.filter(c=>c.auto).reduce((t,c)=>t+c.m,0);
  return {rows, ca, achat, mb, charges, tc, res: mb - tc, parJour, mbJour, a, cvCat, amort, sal};
}
function totalJour(d){
  const j = (full().agg[d.slice(0,7)] || emptyAgg()).jours[d] || {ca:0, mb:0, fourn:0};
  return {ca:j.ca, mb:j.mb, fo:(dayJ(d).f||[]).reduce((t,f)=>t+(f.n||0),0)};
}

/* ---------- Enregistrement ---------- */
const Store = {
  mode:'local', db:null, uid:null, timers:{}, chains:{}, dl:true,
  saveLocal(){ try { localStorage.setItem(LK, JSON.stringify(S)); } catch(e){} },
  touch(key){
    dirty(); this.saveLocal();
    if (this.mode !== 'db') { setStatus('local'); return; }
    setStatus('saving');
    clearTimeout(this.timers[key]);
    this.timers[key] = setTimeout(() => this.push(key), 600);
  },
  push(key){
    const body = key==='atelier' ? S.at : key==='credits' ? S.credits : S.mois[key.slice(2)];
    if (this.mode!=='db') return;
    const ref = this.db.doc('data/users/'+this.uid+'/'+key);
    this.chains[key] = (this.chains[key]||Promise.resolve())
      .then(() => body ? ref.set(JSON.parse(JSON.stringify(body))) : ref.delete())
      .then(() => setStatus('saved'), err => this.fail(err));
    return this.chains[key];
  },
  fail(err){
    const c = err && err.code;
    if (c === 'quota_exceeded') { setStatus('error'); toast("L'espace d'enregistrement est plein. Faites une sauvegarde puis supprimez des mois anciens."); return; }
    if (c === 'unavailable' || c === 'resource_exhausted') { setStatus('error'); toast("Connexion difficile : vos saisies sont gardées sur cet appareil et seront renvoyées à la prochaine modification."); return; }
    this.mode = 'local'; setStatus('local');
    toast("Votre compte n'accepte pas l'enregistrement ici : les données restent sur cet appareil.");
  },
  pushAll(){ this.push('atelier'); this.push('credits'); Object.keys(S.mois).forEach(m => this.push('m-'+m)); },
  async wipe(){
    const keys = ['atelier', 'credits', ...Object.keys(S.mois).map(m=>'m-'+m)];
    S = { at: defaultAtelier(), mois:{}, credits:{tiers:[], dettes:[]} }; dirty();
    this.saveLocal();
    if (this.mode==='db') { try { await Promise.all(keys.map(k => this.db.doc('data/users/'+this.uid+'/'+k).delete())); setStatus('saved'); } catch(e){ this.fail(e); } }
  }
};
function setStatus(s){
  const el = $('#status'); if (!el) return; el.dataset.s = s;
  el.querySelector('span').textContent = {local:'Enregistré sur cet appareil', saving:'Enregistrement…', saved:'Enregistré dans votre compte', error:'Non enregistré — réessai à la prochaine saisie'}[s];
}
let toastT;
function toast(t){ const el = $('#toast'); el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(()=>{el.hidden=true}, 4200); }
function loadLocal(){
  try { const raw = localStorage.getItem(LK); if (raw) { const o = JSON.parse(raw); if (o && o.at && Array.isArray(o.at.produits)) { S = {at:o.at, mois:o.mois||{}, credits:o.credits||{tiers:[], dettes:[]}}; return true; } } } catch(e){}
  return false;
}

function venteLine(x, cu, p, qc, lc){

function achatLine(x, m, lc){

/* Compte de résultat du mois */

  </div><div class="total"><span>Résultat net</span><span class="num" style="color:${b.res<0?'var(--bad)':'var(--good)'}">${b.res<0?'−':''}${F(Math.abs(b.res))}</span></div></section>`;
}
/* Stock au début du mois m (avant le 1er) */
function stockDebut(m, id, isMp){ const st = SDC[m] || (SDC[m] = replay({d:m+'-01', stage:'a'}).st); const s = isMp ? st.mp[id] : st.pf[id]; return s ? s.q : 0; }
function alertesBilan(m, b){
  const out = [], a = b.a;
  if (b.tc === 0) out.push(['warn', `Aucune charge saisie pour ${esc(libMois(m))} : le résultat est trop optimiste. <button class="lnk" data-act="goto" data-tab="charges">Saisir les charges</button>`]);
  S.at.produits.forEach(p => { const x = a.prod[p.id]; if (!x) return;
    if (x.n && p.rend) { const rr = x.obt/x.n; if (rr < p.rend*0.95) out.push(['warn', `<b>${esc(p.nom)}</b> : ${qf(rr)} ${esc(p.u)} par lot au lieu de ${qf(p.rend)}. Il manque ${qf(p.rend*x.n-x.obt)} ${esc(p.u)} sur le mois, soit environ ${F((p.rend*x.n-x.obt)*p.pv)} de ventes en moins. Vérifiez la qualité de la matière, le pressage, la cuisson et la pesée.`]); }
    if (x.obt && x.cost/x.obt > p.pv) out.push(['bad', `<b>${esc(p.nom)}</b> coûte ${F(x.cost/x.obt)} à fabriquer et se vend ${F(p.pv)} : chaque ${esc(p.u)} vendu fait perdre de l'argent.`]);
    if (x.obt && x.per > x.obt*0.03) out.push(['warn', `<b>${esc(p.nom)}</b> : ${qf(x.per)} ${esc(p.u)} perdus (${Math.round(x.per/x.obt*100)} % de la production), pour ${F(x.cp)}. Fabriquez selon ce qui se vend.`]);
  });
  S.at.mp.forEach(mm => { const A = a.mpA[mm.id]; if (!A || !A.q || !mm.pa) return; const pu = A.m/A.q;
    if (pu > mm.pa*1.05) { const us = S.at.produits.filter(p => a.prod[p.id] && (p.lignes||[]).some(l=>l.mp===mm.id)).map(p => { const l = p.lignes.find(l=>l.mp===mm.id); return `${esc(p.nom.toLowerCase())} +${F((pu-mm.pa)*l.q/(p.rend||1))} / ${esc(p.u)}`; });
      out.push(['warn', `<b>${esc(mm.nom)}</b> payé en moyenne ${F(pu)} / ${esc(mm.u)} contre ${F(mm.pa)} d'habitude (+${Math.round((pu/mm.pa-1)*100)} %).${us.length?` Le coût de revient augmente : ${us.join(', ')}. Revoyez le prix de vente ou achetez en plus grande quantité.`:''}`]); } });
  const st = full().st;
  actifsMP().forEach(mm => { const s = st.mp[mm.id]; if (s && s.q <= (mm.seuil||0)) out.push([s.q<=0?'bad':'warn', `${esc(mm.nom)} : ${s.q<=0?'épuisé':'plus que '+qf(s.q)+' '+esc(mm.u)+' en stock'}. Pensez à racheter.`]); });
  if (b.res < 0 && b.ca) out.push(['bad', `Le mois est en déficit. Regardez d'abord le rendement et le prix des matières : ce sont eux qui pèsent le plus dans le coût de revient.`]);
  return out;
}
function chartJours(m, pj){
  const n = nbJours(m), W = 400, H = 180, L = 40, B = 22, T = 10;

  const max = Math.max(...vals, 1), step = niceStep(max), top = Math.ceil(max/step)*step;
  const bw = (W-L-6)/n, y = v => T + (H-T-B) * (1 - v/top);
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Ventes par jour en ${esc(libMois(m))}">`;
  for (let g=0; g<=top; g+=step){ s += `<line class="grid" x1="${L}" x2="${W}" y1="${y(g)}" y2="${y(g)}"/><text x="${L-6}" y="${y(g)+4}" text-anchor="end">${kfmt(g)}</text>`; }
  const td = today();
  vals.forEach((v,i)=>{ const x = L + i*bw + bw*0.15, h = (H-T-B)*(v/top), d = m+'-'+pad(i+1);
    if (v>0) s += `<rect class="bar ${d===td?'today':''}" x="${x.toFixed(1)}" y="${(H-B-h).toFixed(1)}" width="${(bw*0.7).toFixed(1)}" height="${h.toFixed(1)}" rx="2"><title>${court(d)} : ${F(v)}</title></rect>`;
    if (i===0 || (i+1)%5===0) s += `<text x="${(L+i*bw+bw/2).toFixed(1)}" y="${H-6}" text-anchor="middle">${i+1}</text>`; });
  return s + `</svg><div class="legend">Ventes de chaque jour (comptant et crédit), en FCFA. Total : ${F(vals.reduce((a,b)=>a+b,0))}.</div>`;
}
function chartMois(m){
  const ms = Array.from({length:6},(_,i)=>addMonth(m, i-5));
  return barsRes(ms.map(x => ({m:x, b:bilan(x)}))) + `<div class="legend">Bénéfice au-dessus de la ligne, déficit en dessous (rouge), en FCFA.</div>`;
}
function niceStep(max){ const raw = max/4, p = Math.pow(10, Math.floor(Math.log10(raw))); const f = raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function kfmt(v){ const a = Math.abs(v); const s = a>=1e6 ? sp((a/1e6).toLocaleString('fr-FR',{maximumFractionDigits:1}))+' M' : a>=1e3 ? sp((a/1e3).toLocaleString('fr-FR',{maximumFractionDigits:1}))+' k' : String(Math.round(a)); return (v<0?'−':'')+s; }

  const W = 400, H = 180, L = 46, B = 22, T = 10;
  const mx = Math.max(...vals.map(Math.abs), 1), step = niceStep(mx);
  const hi = Math.max(0, Math.ceil(Math.max(...vals)/step)*step), lo = Math.min(0, Math.floor(Math.min(...vals)/step)*step);
  const top = hi===lo ? step : hi, span = (top-lo) || step;
  const y = v => T + (H-T-B)*(top-v)/span, bw = (W-L-6)/n;
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Résultat de chaque mois">`;

function encours(type, d1){
  let s = 0;
  CR().dettes.forEach(x => { const t = tiersDe(x.tiers); if (!t || t.type!==type || x.date > d1) return;
    const p = (x.paiements||[]).filter(y => y.date <= d1).reduce((a,y)=>a+y.m,0); s += Math.max(0, x.m - p); });
  return s;
}

  const stockVal = valeurStock(stockFin(d1));
  let cum = 0, pm = null; Object.keys(b.mbJour).sort().forEach(d => { if (pm) return; cum += b.mbJour[d]; if (b.tc > 0 && cum >= b.tc) pm = d; });
  const joursVente = Object.keys(b.parJour).filter(d => b.parJour[d] > 0).length;
  const eC = encours('client', d1), eF = encours('fournisseur', d1);
  let du = 0, recu = 0;
  CR().dettes.forEach(x => { const t = tiersDe(x.tiers); if (!t || t.type!=='client') return;
    const echu = x.ech ? x.ech <= d1 : addDay(x.date, 30) <= d1; if (!echu) return;

/* ---------- Vue : Crédits (créances clients et dettes fournisseurs) ----------
   Une vente à crédit compte dans les ventes du jour et sort du stock ; un achat de matières à crédit entre dans le stock ;

const LIB = {
  client:{un:'client', liste:'Mes clients me doivent', nouv:'Nouvelle vente à crédit', date:'Date de vente', mont:'Montant de la créance', ref:'N° facture', pay:'Versement', payN:'versement', sigTxt:'Signature du client', vide:"Aucun client ne vous doit d'argent."},
  fournisseur:{un:'fournisseur', liste:'Je dois à mes fournisseurs', nouv:'Nouvel achat ou facture à crédit', date:'Date de livraison', mont:'Montant de la dette', ref:'N° reçu', pay:'Paiement', payN:'paiement', sigTxt:'Signature du fournisseur', vide:'Vous ne devez rien à vos fournisseurs.'}
};
const tiersDe = id => CR().tiers.find(t => t.id===id);
function etatDette(d){
  const paye = (d.paiements||[]).reduce((a,p)=>a+p.m,0), reste = Math.max(0, d.m - paye);
  const t = tiersDe(d.tiers), jours = Math.round((Date.parse(today()+'T12:00:00')-Date.parse(d.date+'T12:00:00'))/864e5);
  const retard = reste > 0 && (d.ech ? d.ech < today() : (t && t.type==='client' && jours > 30));
  return {paye, reste, termine: reste===0, jours, retard};
}
function etatTiers(t){
  const ds = CR().dettes.filter(d => d.tiers===t.id).sort((a,b) => a.date<b.date?-1:a.date>b.date?1:a.ts-b.ts);
  let solde = 0, retard = false, enCours = 0;
  ds.forEach(d => { const e = etatDette(d); solde += e.reste; if (e.retard) retard = true; if (!e.termine) enCours++; });
  return {ds, solde, retard, enCours};
}
function totauxCredits(){
  let client = 0, fourn = 0, retardC = 0, retardF = 0;
  CR().tiers.forEach(t => { const e = etatTiers(t); if (t.type==='client') { client += e.solde; if (e.retard) retardC++; } else { fourn += e.solde; if (e.retard) retardF++; } });
  return {client, fourn, retardC, retardF};
}
function objet(d){
  const parts = [];

  if (d.kind==='charge') parts.push('Charge : '+(d.cnom||''));

/* Crée un crédit relié à l'activité. Renvoie {err} ou {det}. */
function creerDette(sp){

  const det = {id:uid('d'), ts:Date.now()+Math.random(), tiers:t.id, kind:sp.kind, date, ref:sp.ref||'', ech:sp.ech||'', note:sp.note||'', sig:'', paiements:[]};
  if (sp.kind==='charge') {
    const c = S.at.charges.find(x => x.id===sp.cid); if (!c) return {err:'Choisissez la charge.'};
    if (!sp.m) return {err:'Indiquez le montant.'};
    Object.assign(det, {cid:c.id, cnom:c.nom, m:sp.m});
    C.dettes.push(det); Store.touch('credits'); return {det};
  }
  const cli = sp.kind==='vente', q = {};
  (sp.lignes||[]).forEach(l => { const id = cli ? l.pid : l.mp; if (id && l.q > 0) { const o = q[id] || (q[id] = {q:0, m:0}); o.q += l.q; o.m += l.m || 0; } });
  const ids = Object.keys(q); if (!ids.length) return {err:'Indiquez au moins '+(cli?'un produit':'une matière')+' et sa quantité.'};
  det.lignes = ids.map(id => { const it = cli ? pfById(id) : mpById(id), m = q[id].m || Math.round(q[id].q*(cli?it.pv:it.pa)); return cli ? {pid:id, q:q[id].q, m} : {mp:id, q:q[id].q, m}; });

  let down = false, last = null; sigDirty = false;

  c.onpointerdown = ev => { down = true; last = pos(ev); try { c.setPointerCapture(ev.pointerId); } catch(_){} ev.preventDefault(); };
  c.onpointermove = ev => { if (!down) return; const p = pos(ev); g.beginPath(); g.moveTo(last[0],last[1]); g.lineTo(p[0],p[1]); g.stroke(); last = p; sigDirty = true; ev.preventDefault(); };

/* ---------- Retour en arrière et brouillons ----------
   1) Chaque écran (onglet, sous-partie, formulaire, page d'un client) est mémorisé : le bouton « ← » en haut
      et la flèche retour du téléphone ramènent à l'écran précédent.
   2) Ce qui est tapé dans un formulaire est gardé en brouillon (même après fermeture de l'application),
      et quitter un formulaire commencé demande : Enregistrer / Quitter sans enregistrer / Continuer la saisie. */
const DK = LK + '-brouillons';
let DR = {};
try { DR = JSON.parse(localStorage.getItem(DK) || '{}') || {}; } catch(_) { DR = {}; }
const saveDR = () => { try { localStorage.setItem(DK, JSON.stringify(DR)); } catch(_){} };
const NAV = { stack:[], last:null, restoring:false, hist:false, bypass:false, submitting:null, pending:null };

function formKey(f){
  if (!f || !f.id) return null;
  switch (f.id) {
    case 'f-pf': case 'f-mp': case 'f-mat': return f.id + '|' + (U.edit ? U.edit.id : '');
    case 'f-fab': return 'f-fab|' + U.date + '|' + (U.fab ? U.fab.pf : '');
    case 'f-plcr': return 'f-plcr|' + U.date + '|' + f.dataset.kind + '|' + f.dataset.id;
    case 'f-crnew': return 'f-crnew|' + f.dataset.type + '|' + (f.dataset.id || '');
    case 'f-crpay': return 'f-crpay|' + f.dataset.id;
    case 'f-crremb': return 'f-crremb|' + f.dataset.type;
    case 'f-dj': return 'f-dj|' + U.date + '|' + (U.dj || '');
    case 'f-trmv': return 'f-trmv|' + U.mois;
    case 'f-crtiers': case 'f-addchg': case 'f-addperso': return f.id;
    default: return null;
  }
}
const elKey = (el, i) => el.id || ('#' + i);
function saveDraft(f){
  const key = formKey(f); if (!key) return;
  if (f.id === 'f-pf') { collectPf(); DR.edit = JSON.parse(JSON.stringify(U.edit)); }
  if (f.id === 'f-mp' || f.id === 'f-mat') DR.edit = {kind:U.edit.kind, id:U.edit.id};
  const vals = {};
  [...f.elements].forEach((el, i) => { if (!el.tagName || el.type === 'submit' || el.type === 'button' || el.type === 'file') return;
    vals[elKey(el, i)] = (el.type === 'checkbox' || el.type === 'radio') ? {c:el.checked} : el.value; });
  vals.__n = f.querySelectorAll('.nline').length;
  if (f.id !== 'f-pf') DR[key] = vals;
  DR.ui = {plcr:U.plcr || null, dj:U.dj || null};
  saveDR();
}
function dropDraft(f){
  const key = formKey(f); if (key) delete DR[key];
  if (f && (f.id === 'f-pf' || f.id === 'f-mp' || f.id === 'f-mat')) DR.edit = null;
  saveDR();
}
/* Ferme l'état qui fait apparaître un formulaire (sans toucher aux données) */
function closeForm(f){
  switch (f.id) {
    case 'f-pf': case 'f-mp': case 'f-mat': U.edit = null; break;
    case 'f-plcr': U.plcr = null; break;
    case 'f-dj': U.dj = null; break;
    case 'f-crnew': if (U.cr) U.cr.add = false; break;
    case 'f-crpay': if (U.cr) U.cr.pay = null; break;
  }
}
/* Remet le brouillon dans les formulaires affichés */
function restoreDrafts(banner){
  document.querySelectorAll('#app form[id]').forEach(f => {
    const key = formKey(f); if (!key || key === NAV.submitting) return;
    if (f.id === 'f-pf') { if (DR.edit && U.edit && DR.edit.kind==='pf' && DR.edit.id===U.edit.id) { f.dataset.dirty = '1'; } return; }
    const v = DR[key]; if (!v) return;
    if (f.id === 'f-crnew' && v.__n > 1) { const box = f.querySelector('#n-lines'); for (let k = f.querySelectorAll('.nline').length; k < v.__n; k++) box.insertAdjacentHTML('beforeend', lineRow(f.dataset.type)); }
    let any = false;
    [...f.elements].forEach((el, i) => { const x = v[elKey(el, i)]; if (x === undefined) return;
      if (x && typeof x === 'object') { if (el.checked !== x.c) { el.checked = x.c; any = true; } }
      else if (el.value !== x) { el.value = x; any = true; } });
    if (!any) return;
    f.dataset.dirty = '1';
    if (banner && !f.querySelector('.draft')) f.insertAdjacentHTML('afterbegin', '<p class="msg info draft">Saisie non enregistrée reprise : vérifiez puis enregistrez.</p>');
    if (f.id === 'f-fab') { const n = $('#fb-n'); if (n && U.fab) U.fab.n = num(n.value) || 1; majFab(); }

    if (f.id === 'f-plcr') { const s = $('#pc-t'), b = $('#pc-newbox'); if (s && b) b.hidden = s.value !== '__new'; }
    if (f.id === 'f-mat') majMat();
  });
}

/* --- Pile des écrans --- */
function navSnap(){

function navKey(){

}
function navAfterRender(){

    NAV.stack.push(NAV.last.snap); if (NAV.stack.length > 40) NAV.stack.shift();
    try { history.pushState({cdt:NAV.stack.length}, ''); NAV.hist = true; } catch(_) { NAV.hist = false; }
  }

function goBack(){
  const s = NAV.stack.pop(); if (!s) return;
  U.tab = s.tab; U.pv = s.pv; U.bv = s.bv; U.sec = s.sec; U.edit = s.edit; U.confirm = null;

window.addEventListener('popstate', () => {

function navBack(){ if (!NAV.stack.length) return; if (NAV.hist) { try { history.back(); return; } catch(_){} } goBack(); }

/* --- Avertissement avant de quitter un formulaire commencé --- */
const NAV_ACTS = new Set(['goto','goto-rec','goto-mat','new-pf','pv','bv','sec','day','month','cr-side','cr-vue','cr-open','cr-back','cr-quick','dj-see','nav-back','edit','mat-edit']);
const CANCEL_ACTS = new Set(['cancel-edit','pl-cr-no','dj-no','cr-add-no','cr-pay-no']);
const FORM_NOM = {'f-pf':'la recette','f-mp':"l'intrant",'f-mat':'le matériel','f-fab':'la fabrication','f-plcr':'le crédit','f-crnew':'le crédit','f-crpay':'le versement','f-crremb':'le remboursement','f-dj':'la dépense','f-trmv':"l'entrée ou la sortie d'argent",'f-crtiers':'le client','f-addchg':'la charge','f-addperso':'la dépense personnelle'};
function closeCleanForms(){ document.querySelectorAll('#app form[id]').forEach(f => { if (f.dataset.dirty !== '1') closeForm(f); }); }
function askLeave(forms, pending){
  NAV.pending = {forms, pending};
  const noms = [...new Set(forms.map(f => FORM_NOM[f.id] || 'la saisie'))].join(', ');
  let el = $('#leave'); if (!el) { el = document.createElement('div'); el.id = 'leave'; document.body.appendChild(el); }
  el.innerHTML = `<div class="cs-ov" role="dialog" aria-modal="true" aria-labelledby="lv-t"><div class="cs">
    <h2 id="lv-t" style="font-size:1.25rem">Vous n'avez pas enregistré ${esc(noms)}</h2>
    <p>Voulez-vous l'enregistrer avant de quitter cet écran ?</p>
    <div class="col" style="display:flex;flex-direction:column;gap:8px">
      <button class="btn" data-lv="save">Enregistrer</button>

}

/* Sélecteur qui retrouve le bouton après un nouvel affichage */
function selFor(t){
  if (t.classList.contains('tab')) return `.tab[data-tab="${t.dataset.tab}"]`;
  return '[data-act="' + t.dataset.act + '"]' + ['k2','id','k','tab','v'].filter(k => t.dataset[k] !== undefined).map(k => `[data-${k}="${CSS.escape(t.dataset[k])}"]`).join('');
}
function runPending(p){
  closeCleanForms();
  if (p === 'back') { if (NAV.hist) { try { history.back(); return; } catch(_){} } goBack(); return; }
  const t = document.querySelector(p); if (!t) { render(); return; }
  NAV.bypass = true; try { t.click(); } finally { NAV.bypass = false; }
}
document.addEventListener('click', e => {
  const lv = e.target.closest('[data-lv]');
  if (lv) { e.stopPropagation(); const P = NAV.pending; closeLeave(); NAV.pending = null; if (!P) return;
    const k = lv.dataset.lv;
    if (k === 'stay') { const f = P.forms[0]; if (f && document.body.contains(f)) { f.scrollIntoView({block:'center'}); const i = f.querySelector('input,select'); if (i) i.focus(); } return; }
    if (k === 'drop') { P.forms.forEach(f => { dropDraft(f); closeForm(f); f.dataset.dirty = '0'; }); runPending(P.pending); return; }
    if (k === 'save') { let ok = true;
      for (const f of P.forms) { if (!document.body.contains(f)) continue; f.requestSubmit(); if (document.body.contains(f)) { ok = false; f.scrollIntoView({block:'center'}); break; } }
      if (ok) runPending(P.pending);
      return; }
  }
  if (NAV.bypass) return;
  const t = e.target.closest('[data-tab],[data-act]'); if (!t) return;
  const a = t.classList.contains('tab') ? 'tab' : t.dataset.act;
  if (CANCEL_ACTS.has(a)) { const f = t.closest('form') || $('#f-pf') || $('#f-mp') || $('#f-mat'); if (f) dropDraft(f); return; }
  if (a !== 'tab' && !NAV_ACTS.has(a)) return;
  const d = dirtyForms().filter(f => !f.contains(t));
  if (d.length) { e.stopImmediatePropagation(); e.preventDefault(); askLeave(d, a === 'nav-back' ? 'back' : selFor(t)); return; }
  if (a === 'nav-back') { e.stopImmediatePropagation(); closeCleanForms(); navBack(); return; }
  document.querySelectorAll('#app form[id]').forEach(f => { if (f.dataset.dirty !== '1' && !f.contains(t)) closeForm(f); });
}, true);
const marque = e => { const f = e.target.closest && e.target.closest('form[id]'); if (!f || !formKey(f) || e.target.type === 'file') return; f.dataset.dirty = '1'; setTimeout(() => { if (document.body.contains(f)) saveDraft(f); }, 0); };

document.addEventListener('change', marque, true);
document.addEventListener('submit', e => {

  const T = today(), D = k => addDay(T, k), cur = T.slice(0,7), pm = addMonth(cur,-1), pm2 = addMonth(cur,-2);

async function exportCSV(){
  const m = U.mois, b = bilan(m), sep = ';';
  const q = s => '"'+String(s).replace(/"/g,'""')+'"';
  const L = [[q(S.at.nom)], [q('Bilan de '+libMois(m))], [],
    ['Produit','Unité','Lots','Quantité produite','Coût de production','Coût de revient unitaire','Quantité vendue','Quantité perdue','Ventes','Coûts variables','Marge sur coûts variables'].map(q)];
  b.rows.filter(r => r.obt || r.q || r.per).forEach(r => L.push([q(r.p.nom), q(r.p.u), r.n, r.obt, Math.round(r.cost), r.obt?Math.round(r.cost/r.obt):0, r.q, r.per, r.ca, Math.round(r.cv+r.cp), Math.round(r.mb)]));
  L.push([q('Total'), '', b.a.fourn, '', '', '', '', '', b.ca, Math.round(b.achat), Math.round(b.mb)], [], [q('Matière'), q('Achetée'), q('Payé')]);
  S.at.mp.forEach(mm => { const A = b.a.mpA[mm.id]; if (A) L.push([q(mm.nom+' ('+mm.u+')'), A.q, A.m]); });
  L.push([], [q('Charges'), q('Montant')]);

  L.push([q('Total des charges'), b.tc], [], [q('Ventes'), b.ca], [q('Marge sur coûts variables'), Math.round(b.mb)], [q('Total des charges'), b.tc], [q(b.res>=0?'Résultat (bénéfice)':'Résultat (déficit)'), Math.round(b.res)]);
  { const tc = totauxCredits(); L.push([], [q('Crédits en cours au '+today().split('-').reverse().join('/'))], [q('Mes clients me doivent'), tc.client], [q('Je dois à mes fournisseurs'), tc.fourn]); }
  { const k = caisse(m, m), s0 = soldeDebut(m); L.push([], [q('Trésorerie')], [q('Argent disponible au début'), Math.round(s0)], [q('Total des encaissements'), Math.round(k.entree)], [q('Total des décaissements'), Math.round(k.sortie)], [q('Argent disponible à la fin'), Math.round(s0 + k.flux)]); }
  await save('bilan-'+m+'.csv', '﻿'+L.map(r=>r.join(sep)).join('\r\n'));

async function save(filename, data){
  try {
    const blob = new Blob([data], {type: filename.endsWith('.csv') ? 'text/csv;charset=utf-8' : 'application/json'});
    const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename;
    document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 2000);
    toast('Fichier téléchargé : '+filename);
  } catch(e){ toast("Le téléchargement n'a pas pu se faire sur cet appareil."); }
}

    U.edit = null; Store.touch('atelier'); render(); return toast(`${nom} enregistré : ${F(prix/(duree*12))} d'amortissement par mois.`);
  }
  if (f.id === 'f-mp') {
    const err = $('#m-err'), show = m => { err.textContent = m; err.hidden = false; };
    const cat = $('#m-cat').value || 'mp', nom = $('#m-nom').value.trim(), u = $('#m-u').value.trim() || 'kg', pa = int($('#m-pa').value), si = num($('#m-si').value), seuil = num($('#m-seuil').value);
    if (!nom) return show("Donnez un nom à l'intrant."); if (!pa) return show('Indiquez le prix habituel.');
    if (U.edit.id==='new') S.at.mp.push({id:uid('m'), nom, u, pa, si, seuil, cat});
    else { const m = mpById(U.edit.id), old = Object.assign({}, m); Object.assign(m, {nom, u, pa, si, seuil, cat}); dirty(); const r = full(); if (r.neg) { Object.assign(m, old); dirty(); return show('Avec ce stock de départ, ' + negMsg(r.neg) + '.'); } }
    U.edit = null; Store.touch('atelier'); render(); return toast(`${nom} enregistré.`);
  }
  if (f.id === 'f-pf') {
    collectPf(); const d = U.edit.d, err = $('#p-err'), show = m => { err.textContent = m; err.hidden = false; };
    if (!d.nom) return show('Donnez un nom au produit.'); if (!d.pv) return show('Indiquez le prix de vente.'); if (!d.rend) return show('Indiquez ce que donne un lot.');
    d.lignes = d.lignes.filter(l=>l.q>0); d.frais = d.frais.filter(x=>x.nom.trim() && x.m>0);
    /* Intrants créés dans la recette : un nom déjà connu reprend l'intrant existant (un seul stock) */
    for (const [i,l] of d.lignes.entries()) { if (l.mp !== '__new') continue; const nv = l.nv || {};
      if (!(nv.nom||'').trim()) return show(`Intrant n° ${i+1} : donnez-lui un nom.`);
      if (!nv.pa && !S.at.mp.some(m => m.nom.trim().toLowerCase() === nv.nom.trim().toLowerCase())) return show(`Intrant « ${nv.nom.trim()} » : indiquez son prix habituel.`); }
    const crees = [];
    d.lignes.forEach(l => { if (l.mp !== '__new') return; const nv = l.nv, nom = nv.nom.trim();
      let m = S.at.mp.find(x => x.nom.trim().toLowerCase() === nom.toLowerCase());
      if (!m) { m = {id:uid('m'), nom, u:nv.u||'kg', pa:nv.pa, cat:nv.cat||'mp', si:0, seuil:0}; S.at.mp.push(m); crees.push(m.id); } else if (m.actif === false) m.actif = true;
      l.mp = m.id; delete l.nv; });
    d.lignes.forEach(l => { delete l.nv; });
    const ids = d.lignes.map(l=>l.mp); d.lignes = d.lignes.filter((l,i) => ids.indexOf(l.mp) === i || (d.lignes.find(x=>x.mp===l.mp).q += l.q, false));
    if (U.edit.id==='new') S.at.produits.push(Object.assign({id:uid('p')}, d));
    else { const p = pfById(U.edit.id), old = JSON.parse(JSON.stringify(p)); Object.assign(p, d); dirty(); const r = full(); if (r.neg) { Object.assign(p, old); S.at.mp = S.at.mp.filter(m => !crees.includes(m.id)); dirty(); return show('Avec ce stock de départ, ' + negMsg(r.neg) + '.'); } }
    const nom = d.nom, pv = d.pv, cu = coutFournee(d).cu; U.edit = null; Store.touch('atelier'); render();
    return toast((pv < cu ? `${nom} enregistré. Attention : le prix ne couvre pas le coût de revient prévu.` : `${nom} enregistré.`) + (crees.length ? ` ${crees.length} intrant${crees.length>1?'s':''} créé${crees.length>1?'s':''} : pensez à indiquer ${crees.length>1?'leur':'son'} stock de départ dans « Intrants ».` : ''));
  }
});


/* ---------- Licence : essai, activation liée à l'appareil ---------- */
const FREE_ACTS = new Set(['arch','bv','cancel','cancel-edit','cr-back','cr-csv','cr-open','cr-print','cr-rm','cr-side','cr-vue','cr-add-no','cr-pay-no','sig-no','pl-cr-no','dj-no','dj-see','cs-close','cs-next','cs-open','cs-prev','cs-say','cs-say-al','csv','json','day','month','goto','goto-mat','goto-rec','pv','sec','syn-csv','syn-print','to-perso','nav-back','lic-open','lic-copy-dev','lic-copy-msg','install']);
const Lic = { state:'libre', why:'', until:null, left:0, device:'' };
const B32 = '0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function b32e(bytes){ let bits=0, val=0, out=''; for (const b of bytes){ val=((val<<8)|b)&0xffff; bits+=8; while(bits>=5){ out+=B32[(val>>>(bits-5))&31]; bits-=5; } } if (bits>0) out+=B32[(val<<(5-bits))&31]; return out; }
const DAY0 = Date.UTC(2026,0,1);
const dateOf = n => new Date(DAY0 + n*864e5).toISOString().slice(0,10);
const locked = () => Lic.state==='expire' || Lic.state==='invalide';
const fmtDev = id => id.slice(0,4)+'-'+id.slice(4);
function deviceId(){
  let id = null; try { id = localStorage.getItem('ct-appareil'); } catch(e){}
  if (!id || !/^[0-9A-Z]{8}$/.test(id)) {
    const b = new Uint8Array(5);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(b); else for (let i=0;i<5;i++) b[i] = Math.random()*256|0;
    id = b32e(b); try { localStorage.setItem('ct-appareil', id); } catch(e){}
  }
  return id;
}
function lireCode(code){
  try {
    const c = String(code||'').replace(/\s+/g,'').replace(/^CT1-/i,'');
    const b = b64d(c); if (b.length !== 66) return null;
    const exp = (b[0]<<8) | b[1];
    const ok = Ed.verify(utf8('ACT|'+LIC.d.serial+'|'+Lic.device+'|'+exp), b.slice(2), b64d(PUB));
    return ok ? {illimite: exp===65535, until: exp===65535 ? null : dateOf(exp)} : null;
  } catch(e){ return null; }
}
function computeLic(){
  if (!LIC || !licOk(LIC)) { Lic.state = 'invalide'; return; }
  Lic.device = deviceId();
  const t = today(), kLast = 'ct-vu-'+SERIAL;
  let last = null; try { last = localStorage.getItem(kLast); } catch(e){}
  const recul = !!(last && t < addDay(last,-1));
  if (!recul && (!last || t > last)) { try { localStorage.setItem(kLast, t); } catch(e){} }
  let code = null; try { code = localStorage.getItem('ct-code-'+SERIAL); } catch(e){}
  const a = code ? lireCode(code) : null;
  if (a) {
    if (a.illimite) { Lic.state='actif'; Lic.until=null; return; }
    Lic.until = a.until;
    if (!recul && t <= a.until) { Lic.state='actif'; return; }
    Lic.state='expire'; Lic.why = recul ? 'date' : 'licence'; return;
  }
  if (recul) { Lic.state='expire'; Lic.why='date'; return; }
  if (t < LIC.d.essaiFin) {
    Lic.state='essai';
    Lic.left = Math.round((Date.parse(LIC.d.essaiFin+'T12:00:00')-Date.parse(t+'T12:00:00'))/864e5);
    return;
  }
  Lic.state='expire'; Lic.why='essai';
}
const titulaire = () => LIC ? LIC.d.client + (LIC.d.boutique ? ' — '+LIC.d.boutique : '') + (LIC.d.ville ? ', '+LIC.d.ville : '') : '';
function renderLicbar(){
  const el = $('#licbar'); if (!LIC) { el.hidden = true; return; }
  el.hidden = false;
  el.className = 'licbar ' + (Lic.state==='essai'?'essai':locked()?'expire':'');
  const lien = U.tab==='licence' ? '' : `<button class="lnk" data-act="lic-open">${Lic.state==='actif'?'Licence':'Activer'}</button>`;
  if (Lic.state==='invalide') el.innerHTML = `<span><b>Lien non valable.</b> Demandez un nouveau lien à votre fournisseur.</span>${lien}`;
  else if (Lic.state==='essai') el.innerHTML = `<span><b>Essai gratuit :</b> encore ${Lic.left} jour${Lic.left>1?'s':''} (jusqu'au ${court(addDay(LIC.d.essaiFin,-1))} inclus) · ${esc(titulaire())}</span>${lien}`;
  else if (locked()) el.innerHTML = `<span><b>${Lic.why==='essai'?"Période d'essai terminée":Lic.why==='date'?'Date du téléphone incorrecte':'Licence expirée'}</b> · ${esc(titulaire())}</span>${lien}`;
  else el.innerHTML = `<span>Licence n° ${esc(LIC.d.serial)} accordée à <b>${esc(titulaire())}</b>${Lic.until?' · valable jusqu\'au '+court(Lic.until)+'/'+Lic.until.slice(0,4):''}</span>${lien}`;
}
function lockedNote(){
  const why = Lic.state==='invalide' ? "Ce lien de licence n'est pas valable. Demandez un nouveau lien à votre fournisseur."
    : Lic.why==='date' ? "La date de ce téléphone est antérieure à la dernière utilisation. Remettez le téléphone à la bonne date pour continuer."
    : Lic.why==='licence' ? "Votre licence est arrivée à échéance. Vos données sont conservées : vous pouvez consulter le bilan et télécharger une sauvegarde."
    : "La période d'essai est terminée. Vos données sont conservées : vous pouvez consulter le bilan et télécharger une sauvegarde. Pour continuer à saisir, activez votre licence.";
  return `<div class="locked-note"><b>${Lic.state==='invalide'?'Copie non valable':'Saisie bloquée'}</b><span>${why}</span>${Lic.state==='invalide'?'':'<div><button class="btn" data-act="lic-open">Activer ma licence</button></div>'}</div>`;
}
function messageActivation(){
  return `Bonjour${LIC.d.vendeur?' '+LIC.d.vendeur:''}, je souhaite activer Cahier de Transformation.\nLicence n° ${LIC.d.serial}\nCode appareil : ${fmtDev(Lic.device)}\nTitulaire : ${titulaire()}`;
}
function vLicence(){
  const etat = {actif: Lic.until ? 'Active jusqu\'au '+court(Lic.until)+'/'+Lic.until.slice(0,4) : 'Active, sans limite de durée', essai: 'Essai gratuit, encore '+Lic.left+' jour'+(Lic.left>1?'s':''), expire: Lic.why==='essai'?'Essai terminé':Lic.why==='date'?'Bloquée (date du téléphone)':'Expirée', invalide:'Copie non valable'}[Lic.state];
  const wa = (LIC.d.contact||'').replace(/[^\d]/g,'');
  let h = `<div class="nav"><button class="ib" data-act="goto" data-tab="jour" aria-label="Retour">${IC.l}</button><h2 style="text-transform:none">Ma licence</h2><span style="width:44px"></span></div>
  <div class="panel"><dl class="kv">
    <dt>Titulaire</dt><dd>${esc(LIC.d.client)}</dd>
    ${LIC.d.boutique?`<dt>Atelier</dt><dd>${esc(LIC.d.boutique)}${LIC.d.ville?', '+esc(LIC.d.ville):''}</dd>`:''}
    <dt>Licence n°</dt><dd class="num">${esc(LIC.d.serial)}</dd>
    <dt>État</dt><dd>${esc(etat)}</dd>
  </dl></div>`;
  if (Lic.state==='invalide') return h + `<div class="locked-note"><span>Ce lien de licence n'est pas valable. Il ne peut pas être activé.</span></div>`;
  h += `<div class="panel"><h3>Code de cet appareil</h3>
    <p class="sub">Envoyez ce code à votre fournisseur. Le code d'activation qu'il vous renverra ne marchera que sur ce téléphone.</p>
    <div class="row"><span class="code" id="devcode">${fmtDev(Lic.device)}</span><button class="btn quiet" data-act="lic-copy-dev">Copier</button></div>
  </div>
  <div class="panel"><h3>Demander l'activation</h3>
    <p class="sub">${LIC.d.vendeur?esc(LIC.d.vendeur)+' · ':''}${LIC.d.contact?'<span class="num">'+esc(LIC.d.contact)+'</span>':''}</p>
    <pre id="actmsg" style="white-space:pre-wrap;font-family:var(--f-body);background:var(--sunk);padding:10px 12px;border-radius:8px;margin:0;font-size:.9rem">${esc(messageActivation())}</pre>
    <div class="row"><button class="btn quiet" data-act="lic-copy-msg">Copier le message</button>${wa?`<a class="btn ghost" style="display:inline-flex;align-items:center;text-decoration:none" target="_blank" rel="noopener" href="https://wa.me/${wa}?text=${encodeURIComponent(messageActivation())}">Envoyer par WhatsApp</a>`:''}</div>
  </div>
  <form class="panel" id="f-act" data-free><h3>Saisir le code d'activation</h3>
    <label class="sr" for="f-actcode">Code d'activation</label>
    <textarea class="in" id="f-actcode" placeholder="Collez ici le code reçu (il commence par CT1-)"></textarea>
    <p class="msg bad" id="act-err" hidden></p>
    <div class="row"><button class="btn" type="submit" id="b-act">Activer</button></div>
  </form>` + blocInstall();
  return h;
}
function activer(){
  const code = $('#f-actcode').value.trim(), err = $('#act-err');
  const a = code && lireCode(code);
  if (!a) { err.textContent = /^CB1-/i.test(code) ? "Ce code est celui de Cahier de Boutique. Demandez le code de Cahier de Transformation en envoyant le code appareil " + fmtDev(Lic.device) + "." : "Ce code ne correspond pas à ce téléphone ou à cette licence. Vérifiez que vous avez copié tout le code, ou redemandez-le en envoyant le code appareil " + fmtDev(Lic.device) + "."; err.hidden = false; return; }
  if (!a.illimite && a.until < today()) { err.textContent = "Ce code est valable jusqu'au "+court(a.until)+'/'+a.until.slice(0,4)+" : il a déjà expiré. Demandez un nouveau code."; err.hidden = false; return; }
  try { localStorage.setItem('ct-code-'+SERIAL, code.replace(/\s+/g,'')); } catch(e){}
  computeLic(); U.tab = 'jour'; render();
  toast(a.illimite ? 'Licence activée, sans limite de durée.' : 'Licence activée jusqu\'au '+court(a.until)+'/'+a.until.slice(0,4)+'.');
}
function copier(txt){
  const done = () => toast('Copié.');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => fallbackCopy(txt));
  else fallbackCopy(txt);
}
function fallbackCopy(txt){ const ta = document.createElement('textarea'); ta.value = txt; document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); toast('Copié.'); } catch(e){ toast('Sélectionnez le texte pour le copier.'); } ta.remove(); }
function licAct(a){
  if (a==='lic-open') { U.tab='licence'; render(); window.scrollTo(0,0); return true; }
  if (a==='lic-copy-dev') { copier(fmtDev(Lic.device)); return true; }
  if (a==='lic-copy-msg') { copier(messageActivation()); return true; }
  return false;
}
// Revérifie la licence quand on revient sur l'application (passage de minuit, etc.)
document.addEventListener('visibilitychange', () => { if (!document.hidden && LIC) { const before = Lic.state; computeLic(); if (Lic.state !== before) render(); } });
if (lienRefuse) setTimeout(() => toast(lienRefuse==='app' ? "Ce lien est celui de Cahier de Boutique : ouvrez-le dans Cahier de Boutique, ou demandez le lien de Cahier de Transformation." : "Ce lien n'est pas valable : il a été modifié ou ne vient pas de votre fournisseur."), 300);

/* ---------- Version en ligne : accueil sans licence, installation ---------- */
function lireLienLicence(txt){
  const t = String(txt||'').trim(); let raw = null;
  const m = t.match(/[?&]l=([A-Za-z0-9_-]+)/); if (m) raw = m[1]; else if (/^[A-Za-z0-9_-]{40,}$/.test(t)) raw = t;
  if (!raw) return null;
  try { const o = JSON.parse(new TextDecoder().decode(b64d(raw))); return licOk(o) ? o : (o && o.d && o.d.app !== APP_LIC ? 'app' : null); } catch(e){ return null; }
}
function renderWelcome(){
  $('#licbar').hidden = true;
  document.querySelector('.tabs').hidden = true;
  $('#app').innerHTML = `<div class="view">
    <div class="panel" style="text-align:center;align-items:center;padding:24px 16px">
      <div class="logo" style="width:64px;height:64px;border-radius:16px"><svg viewBox="0 0 24 24" width="36" height="36" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11h16v3.5A5.5 5.5 0 0 1 14.5 20h-5A5.5 5.5 0 0 1 4 14.5z"/><path d="M2.5 11h19"/><path d="M9 3.5c-.8 1 .8 2 0 3M13 3.5c-.8 1 .8 2 0 3"/></svg></div>
      <h2 style="font-size:1.5rem;text-transform:none">Bienvenue dans Cahier de Transformation</h2>
      <p class="sub" style="margin:0;max-width:40ch">Pour commencer, ouvrez le <b>lien personnel</b> que votre fournisseur vous a envoyé par WhatsApp. Vous pouvez aussi le coller ci-dessous.</p>
    </div>
    <form class="panel" id="f-welcome" data-free>
      <label class="fld" for="w-l">Lien ou code reçu</label>
      <textarea class="in" id="w-l" placeholder="Collez ici le lien qui commence par https://"></textarea>
      <p class="msg bad" id="w-err" hidden></p>
      <div class="row"><button class="btn" type="submit">Ouvrir mon application</button></div>
    </form></div>`;
}
document.addEventListener('submit', e => {
  if (e.target.id !== 'f-welcome') return;
  e.preventDefault(); e.stopImmediatePropagation();
  const o = lireLienLicence($('#w-l').value);
  if (!o || o==='app') { const er = $('#w-err'); er.textContent = o==='app' ? "Ce lien est celui de Cahier de Boutique. Demandez à votre fournisseur le lien de Cahier de Transformation." : "Ce lien n'est pas reconnu. Vérifiez que vous avez copié tout le lien envoyé par votre fournisseur."; er.hidden = false; return; }
  try { localStorage.setItem('ct-lic', JSON.stringify(o)); } catch(_){}
  location.replace(location.pathname);
}, true);
/* Bouton « Installer l'application » quand le téléphone le propose */
let installEvt = null;
window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); installEvt = e; if (LIC) render(); });
window.addEventListener('appinstalled', () => { installEvt = null; toast("Application installée : retrouvez l'icône Transformation sur votre écran d'accueil."); });
const estInstallee = () => (window.matchMedia && matchMedia('(display-mode: standalone)').matches) || navigator.standalone === true;
function blocInstall(){
  if (estInstallee()) return '';
  return `<div class="panel install"><h3>Mettre l'application sur l'écran d'accueil</h3>
    ${installEvt ? '<div class="row"><button class="btn" data-act="install">Installer l\'application</button></div>' : ''}
    <p class="sub" style="margin:0">${installEvt ? 'Ou bien : ' : ''}dans Chrome, touchez le menu <b>⋮</b> puis <b>« Installer l'application »</b> ou <b>« Ajouter à l'écran d'accueil »</b>. Sur Samsung Internet, touchez <b>☰</b> puis <b>« Ajouter page à »</b> → <b>« Écran d'accueil »</b>.</p></div>`;
}
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act="install"]'); if (!t || !installEvt) return;
  e.stopImmediatePropagation(); installEvt.prompt(); try { await installEvt.userChoice; } catch(_){} installEvt = null; render();
}, true);
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost' || location.hostname === '127.0.0.1')) { try { navigator.serviceWorker.register('sw.js'); } catch(e){} }

/* ---------- Démarrage ---------- */
if (!loadLocal()) U.tab = 'produits';
migrate(); computeLic(); navBoot(); dirty(); render(); if (LIC) { ouvrirConseilDuJour(); renderConseil(); }
document.addEventListener('keydown', e => { if (e.key==='Escape' && U.conseil) { U.conseil = null; renderConseil(); } });
})();
